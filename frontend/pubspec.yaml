name: shield
description: "SHIELD Healthcare Platform"
publish_to: 'none'
version: 0.0.4+2026081401

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7
  app_links: ^6.3.2

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  file_picker: ^8.1.2
  fluttertoast: ^9.0.0
  syncfusion_flutter_datepicker: ^33.2.13+1
  syncfusion_flutter_pdfviewer: ^33.2.13
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  firebase_core: ^4.11.0
  firebase_auth: ^6.0.1
  firebase_auth_web: ^6.2.3
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.3
  google_sign_in: ^6.3.0
  flutter_web_plugins:
    sdk: flutter
  js: ^0.6.7
  sentry_flutter: 9.22.0
  web: ^1.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/images/operations/
